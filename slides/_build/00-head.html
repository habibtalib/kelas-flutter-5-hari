<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelas Flutter 5 Hari — eTT Mobile</title>
  <link rel="stylesheet" href="vendor/reveal/dist/reset.css">
  <link rel="stylesheet" href="vendor/reveal/dist/reveal.css">
  <link rel="stylesheet" href="vendor/reveal/dist/theme/white.css" id="theme">
  <link rel="stylesheet" href="vendor/reveal/dist/plugin/highlight/monokai.css">
  <style>
    :root {
      --navy: #1A2B5C;
      --navy-2: #24386f;
      --gold: #D4A017;
      --ink: #1A1A2E;
      --muted: #566371;
      --line: #e2e5ee;
      --panel: #ffffff;
      --paper: #F5F6FA;
      --green: #16794a;
      --red: #b42318;
      --amber: #b45309;
      --blue: #2563eb;
      --purple: #7c3aed;
    }

    .reveal {
      color: var(--ink);
      font-family: "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 30px;
    }

    .reveal .slides { text-align: left; }

    .reveal section {
      box-sizing: border-box;
      height: 100%;
      padding: 40px 60px;
    }

    .reveal h1, .reveal h2, .reveal h3, .reveal h4, .reveal p {
      margin: 0;
      letter-spacing: 0;
      text-transform: none;
    }
    .reveal h1 { color: var(--ink); font-size: 66px; line-height: 1.0; font-weight: 850; }
    .reveal h2 { color: var(--ink); font-size: 46px; line-height: 1.05; font-weight: 820; }
    .reveal h3 { color: var(--navy); font-size: 34px; line-height: 1.1; font-weight: 800; margin-bottom: 18px; }
    .reveal h4 { color: var(--ink); font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .reveal p, .reveal li, .reveal td, .reveal th { color: var(--muted); font-size: 23px; line-height: 1.4; }
    .reveal ul, .reveal ol { margin: 0; padding-left: 1.1em; }
    .reveal li + li { margin-top: 8px; }
    .reveal strong { color: var(--ink); }
    .reveal em { color: var(--navy); font-style: normal; font-weight: 700; }
    .reveal a { color: var(--blue); }

    /* Lead sentence */
    .reveal .lead { font-size: 30px; color: var(--ink); font-weight: 600; line-height: 1.3; }
    .reveal .small { font-size: 18px; }
    .reveal .muted { color: var(--muted); }

    /* Kicker / eyebrow label */
    .reveal .kicker {
      display: inline-block;
      font-size: 16px; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gold);
      border: 1px solid rgba(212,160,23,0.5); border-radius: 999px;
      padding: 4px 14px; margin-bottom: 22px;
    }

    /* Chapter (day) divider slide */
    .reveal .chapter .kicker { color: var(--gold); border-color: rgba(212,160,23,0.6); }
    .reveal .chapter h2 { color: #ffffff; font-size: 60px; }
    .reveal .chapter .sub { color: rgba(255,255,255,0.72); font-size: 26px; margin-top: 14px; }
    .reveal .chapter .agenda { color: rgba(255,255,255,0.9); margin-top: 22px; }
    .reveal .chapter .agenda li { color: rgba(255,255,255,0.82); }

    /* Title slide */
    .reveal .title-slide h1 { color: #ffffff; }
    .reveal .title-slide .sub { color: var(--gold); font-size: 30px; font-weight: 700; margin-top: 16px; }
    .reveal .title-slide .meta { color: rgba(255,255,255,0.7); font-size: 20px; margin-top: 28px; }
    .reveal .title-slide .badge {
      display:inline-block; font-size: 88px; margin-bottom: 10px;
    }

    /* Grid children must be allowed to shrink, else long code overflows the slide */
    .reveal .two-col > *, .reveal .three-col > *, .reveal .cards > * { min-width: 0; }
    .reveal code, .reveal p, .reveal li, .reveal h4 { overflow-wrap: anywhere; word-break: break-word; }
    .reveal section > * { max-width: 100%; }

    /* Two-column layout */
    .reveal .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
    .reveal .two-col.wide-left { grid-template-columns: 1.4fr 1fr; }
    .reveal .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

    /* Card grid */
    .reveal .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 12px; }
    .reveal .cards.c3 { grid-template-columns: repeat(3, 1fr); }
    .reveal .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 20px;
    }
    .reveal .card h4 { color: var(--navy); }
    .reveal .card p, .reveal .card li { font-size: 19px; }
    .reveal .card.accent { border-left: 5px solid var(--gold); }
    .reveal .card.navy { background: var(--navy); }
    .reveal .card.navy h4, .reveal .card.navy p, .reveal .card.navy li { color: #fff; }

    /* Pills */
    .reveal .pill {
      display: inline-block; font-size: 16px; font-weight: 700;
      padding: 3px 12px; border-radius: 999px; margin: 2px 4px 2px 0;
      background: rgba(26,43,92,0.10); color: var(--navy);
    }
    .reveal .pill.gold { background: rgba(212,160,23,0.16); color: var(--amber); }
    .reveal .pill.green { background: rgba(22,121,74,0.14); color: var(--green); }
    .reveal .pill.red { background: rgba(180,35,24,0.12); color: var(--red); }

    /* Callout note */
    .reveal .note {
      background: rgba(26,43,92,0.05); border-left: 5px solid var(--navy);
      border-radius: 10px; padding: 14px 20px; margin-top: 16px; font-size: 21px;
    }
    .reveal .note.gold { background: rgba(212,160,23,0.09); border-color: var(--gold); }
    .reveal .note.warn { background: rgba(180,35,24,0.07); border-color: var(--red); }
    .reveal .note.tip { background: rgba(22,121,74,0.07); border-color: var(--green); }

    /* Tables */
    .reveal table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .reveal th { color: var(--ink); font-weight: 800; text-align: left; border-bottom: 2px solid var(--navy); padding: 8px 10px; font-size: 20px; }
    .reveal td { border-bottom: 1px solid var(--line); padding: 8px 10px; font-size: 20px; }
    .reveal table.tight td, .reveal table.tight th { font-size: 18px; padding: 6px 8px; }

    /* Code blocks */
    .reveal pre { width: 100%; box-shadow: none; margin: 12px 0; font-size: 20px; }
    .reveal pre code {
      border-radius: 12px; padding: 16px 20px; max-height: 480px;
      font-family: "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
      line-height: 1.45;
    }
    .reveal .code-sm pre code { font-size: 17px; }

    /* Step / numbered chips */
    .reveal .steps { counter-reset: step; list-style: none; padding-left: 0; }
    .reveal .steps li { position: relative; padding-left: 46px; margin-bottom: 12px; }
    .reveal .steps li::before {
      counter-increment: step; content: counter(step);
      position: absolute; left: 0; top: 0;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--navy); color: #fff; font-weight: 800; font-size: 18px;
      display: grid; place-items: center;
    }

    /* Footer brand */
    .reveal .slide-tag { position: absolute; bottom: 18px; right: 24px; font-size: 14px; color: var(--gold); font-weight: 700; letter-spacing: 0.08em; }

    .reveal .center { text-align: center; }
    .reveal .center h1, .reveal .center h2, .reveal .center h3 { margin-left: auto; margin-right: auto; }

    .reveal .progress { color: var(--gold); }
    .reveal .controls { color: var(--navy); }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
